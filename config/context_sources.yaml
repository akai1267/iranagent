critical_threats:
  enabled: true
  discovery_interval_sec: 1200
  timeout_sec: 20
  morning_pattern: "Iran Update Morning Special Report"
  evening_pattern: "Iran Update Evening Special Report"

iran_monitor_structural:
  enabled: true
  refresh_interval_sec: 86400
  url: "https://www.iranmonitor.org/whats-happening-in-iran"

iran_monitor_briefing:
  enabled: true
  discovery_interval_sec: 1200
  timeout_sec: 20

snapshot_policy:
  max_staleness_sec: 21600
  startup_jitter_sec: 30
  max_stream_deltas_in_snapshot: 12
  max_stream_deltas_in_prompt: 10
