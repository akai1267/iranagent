version: 1

pack:
  compile_tick_sec: 60
  max_pack_age_sec: 5400
  retention_count: 120
  max_stream_deltas: 10
  max_prior_posts: 6

weights:
  structural_context: 0.35
  current_picture: 0.45
  latest_stream_deltas: 0.15
  relevant_prior_posts: 0.05

writing_policy:
  output_shape: analyst_note
  public_grounding_mode: hidden_provenance
  inference_mode: disciplined_thesis
  writer_pipeline_v2: true

temperature_policy:
  post_frame: 0.25
  post_prose: 0.75
  post_prose_rewrite: 0.65
  post_verifier_v2: 0.10
  current_picture_frame: 0.25
  current_picture_prose: 0.65
  current_picture_verifier_v2: 0.10
  query_answer: 0.60
  theory_rewrite: 0.50
  theory_verifier: 0.10

prior_context_policy:
  excluded_quality_flags:
    - stale_status
    - low_confidence_stream_only
  exclude_banned_phrase_posts: true
  max_age_days: 14
  prompt_max_posts: 4

title_policy:
  max_words: 10
  avoid_generic_titles: true
  derive_from_thesis_if_missing: true

current_picture_policy:
  paragraph_min: 4
  paragraph_max: 5
  allow_markdown_headings: false
  analyst_specificity_required: true

publish_policy:
  require_authoritative_fresh: true
  authoritative_anchor_max_age_hours: 12
  allow_stale_status_note: true
  stale_status_cooldown_sec: 86400
  min_evidence_refs: 2
  block_low_confidence_stream_only: true

theory_policy:
  update_requires_authoritative_fresh: true
  min_evidence_refs: 2
  bootstrap_reset_once: true

query_policy:
  changed_today_keywords: "changed today,today,latest change"
  require_layer_order: true

style_policy:
  banned_phrases:
    - "another round of sanctions"
    - "proxy route gives"
    - "iran is not striking directly right now"
    - "multiple competing assessments"
    - "it remains to be seen"
    - "some analysts argue"
    - "complex and unpredictable"
  require_paragraphs_only: true
  require_evidence_tags: false

observability:
  unchanged_throttle_sec: 900
  blocked_throttle_sec: 300
