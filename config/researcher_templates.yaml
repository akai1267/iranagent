post_judgment: |
  Context: {{context}}

  Layered context:
  {{layered_context}}

  Anchor documents:
  {{anchor_documents}}

  Worth publishing? Only yes if at least one is true:
  - stream materially changes the current picture
  - stream contradicts the current picture
  - you can draw an implication the briefings did not draw
  - this revises a prior post/theory

  Use this priority order:
  Structural Context -> Current Picture -> Latest Deltas -> Prior Posts.

  Do NOT publish if:
  - it just summarizes CTP/ISW or Iran Monitor recap
  - it restates current picture language
  - it mirrors a stream headline without analytical gain

  Return JSON: {"worth_posting": bool, "reason": "one sentence", "supersedes_id": "post id or null"}

post_frame: |
  {{editorial_brief}}

  Build an internal post frame for a compact analyst note.

  Context trigger:
  {{context}}

  Layered context:
  {{layered_context}}

  Freshness contract:
  {{freshness_contract}}

  Working theories:
  {{working_theories}}

  Prompt-eligible prior posts:
  {{relevant_prior_posts}}

  Evidence ledger:
  {{evidence_ledger}}

  Return JSON:
  {
    "title": "str",
    "thesis": "str",
    "why_now": "str",
    "core_claims": [{"claim": "str", "evidence_ids": ["E1", "E2"]}],
    "supporting_evidence_ids": ["E1", "E2"],
    "revision_of_prior": "str or null",
    "watchpoint": "str",
    "confidence": "high|medium|low",
    "quality_risks": ["str"]
  }

post_prose: |
  {{editorial_brief}}

  Turn this internal frame into a public analyst note.

  Frame:
  {{frame_json}}

  Freshness contract:
  {{freshness_contract}}

  Rules:
  - Write 3-5 dense paragraphs.
  - No bullets, headings, JSON, or visible evidence tags.
  - Lead with the thesis.
  - Mention concrete actors, actions, places, or timing when the frame supports them.
  - Make a best-read judgment when warranted, but do not overstate beyond the frame.

  Write the final note only.

post_prose_rewrite: |
  {{editorial_brief}}

  Rewrite this analyst note to fix the verifier issues.

  Frame:
  {{frame_json}}

  Freshness contract:
  {{freshness_contract}}

  Issues:
  {{issues}}

  Draft:
  {{draft}}

  Rules:
  - Keep it in 3-5 dense paragraphs.
  - No headings, bullets, JSON, or visible evidence tags.
  - Remove unsupported leaps, vague filler, and recycled framing.

  Write the final revised note only.

post_verifier_v2: |
  Verify this public analyst note against the internal frame and evidence.

  Frame:
  {{frame_json}}

  Public note:
  {{post_content}}

  Freshness:
  {{freshness}}

  Evidence ledger:
  {{evidence_ledger}}

  Checks:
  1. Every material public claim maps back to the frame and evidence IDs
  2. No unsupported leap beyond evidence
  3. No stale-context certainty
  4. No generic filler, boilerplate, or recycled contamination phrasing
  5. No visible evidence tags in public prose

  Return JSON:
  {"passes": true, "issues": [], "needs_rewrite": false, "claim_map": [{"claim": "str", "evidence_ids": ["E1"]}], "quality_flags": []}

write_post: |
  {{editorial_brief}}
  {{superseded_note}}

  Context: {{context}}

  Layered context:
  {{layered_context}}

  Freshness contract:
  {{freshness_contract}}

  Working theories:
  {{working_theories}}

  Prompt-eligible prior posts:
  {{relevant_prior_posts}}

  Evidence ledger:
  {{evidence_ledger}}

  Return JSON: {"title": "str", "content": "str", "tags": ["str"]}

rewrite_post: |
  {{editorial_brief}}

  Rewrite this post to pass strict grounding checks.
  Issues:
  {{issues}}

  Original draft:
  {{draft}}

  Evidence ledger:
  {{evidence_ledger}}

  Freshness contract:
  {{freshness_contract}}

  Rules:
  - Remove unsupported, stale, or boilerplate claims.
  - Do not infer beyond freshness horizon.

  Return JSON: {"title": "str", "content": "str", "tags": ["str"]}

post_verifier: |
  Verify this candidate post before publish.

  Title:
  {{title}}

  Post:
  {{post_content}}

  Freshness:
  {{freshness}}

  Current picture excerpt:
  {{current_picture}}

  Evidence ledger:
  {{evidence_ledger}}

  Checks:
  1. Unsupported or unmapped material claims
  2. Stale-context overconfidence
  3. Contradiction with current picture
  4. Boilerplate/copied framing and vague filler
  5. Missing concrete grounding tags [E#]
  6. Restating recap headlines without analysis

  Return JSON:
  {"passes": true, "issues": [], "needs_rewrite": false, "quality_flags": []}

theory_update_check: |
  Post written:
  {{post_content}}

  Current working theories:
  {{current_theories}}

  Grounding evidence:
  {{evidence_snippets}}

  Did this change HOW YOU THINK — not just what you know?
  Warranted: pattern confirmed as prior, prior overturned, new useful lens.
  Not warranted: new facts fitting existing priors.

  Return JSON: {"update_warranted": bool, "what_changes": "str or null"}

theory_rewrite: |
  {{editorial_brief}}

  Current working theories:
  {{current_theories}}

  Structural context:
  {{structural_context}}

  Current picture:
  {{current_picture}}

  Evidence snippets:
  {{evidence_snippets}}

  What changes: {{update_reason}}

  Rewrite incorporating this update. First person, direct. Priors and lenses, not facts.
  Do not introduce claims not supported by current picture/anchors.
  Return full updated document text only.

theory_verifier: |
  Validate this theory update.

  Updated theories:
  {{updated_theories}}

  Evidence snippets:
  {{evidence_snippets}}

  Checks:
  1. Lens changes are supported by evidence
  2. No stale or template framing
  3. Not merely rewriting style without epistemic change

  Return JSON: {"passes": true, "issues": []}

query_answer: |
  {{editorial_brief}}

  Question: {{question}}

  Your prior posts on this topic (cite as "as I wrote on [date], [title]..."):
  {{prior_posts}}

  Working theories:
  {{working_theories}}

  Layered context (from briefing pack):
  {{layered_context}}

  Instruction:
  - Weight in this order: Structural Context, Current Picture, Stream Deltas, Prior Posts.
  - Never treat stream as more authoritative than anchor sources.
  - Do not regurgitate recap headlines.
  - If asked what changed today, answer current picture first, then explicitly list deltas newer than stream_last_included_at.
  {{uncertainty_line}}
  {{changed_today_line}}

  Answer directly. Cite your own posts. If uncertain, say what is known vs unknown.

current_picture_frame: |
  {{current_picture_brief}}

  Build an internal current-picture frame for an analyst brief.

  Source map:
  {{source_map}}

  Stream deltas since primary anchor:
  {{delta_lines}}

  Previous current picture excerpt:
  {{previous_excerpt}}

  Return JSON:
  {
    "topline": "str",
    "operational_picture": "str",
    "political_diplomatic_picture": "str",
    "what_changed": "str",
    "what_is_continuing": "str",
    "watchpoints_12_24h": "str",
    "gaps": "str",
    "source_use": "str"
  }

current_picture_prose: |
  {{current_picture_brief}}

  Turn this internal frame into a compact analyst brief.

  Frame:
  {{frame_json}}

  Rules:
  - Write 4-5 compact paragraphs.
  - No bullets, headings, or numbered sections.
  - Keep it analyst-facing, not introductory.
  - Stream deltas belong as deltas, not the main frame.
  - Be specific about actors, actions, timelines, and operational meaning when the frame supports them.

  Write the final brief only.

current_picture_verifier_v2: |
  Verify this current-picture analyst brief.

  Frame:
  {{frame_json}}

  Brief:
  {{snapshot_text}}

  Source docs summary:
  {{source_brief}}

  Stream delta count: {{stream_delta_count}}

  Checks:
  1. Analyst specificity rather than lay framing
  2. Source hierarchy respected
  3. No recap intro boilerplate or generic filler
  4. No invented detail or unsupported precision
  5. Stream treated as delta layer rather than anchor

  Return JSON:
  {"passes": true, "issues": [], "needs_rewrite": false}

stream_assessment: |
  Recent stream entries:
  {{recent_stream}}

  Layered context (from briefing pack):
  {{layered_context}}

  Given the latest structural context and current picture:
  1. Do these new stream deltas materially change the picture?
  2. Is this a contradiction, delta, confirmation, or none?
  3. Is there a new open question worth researching?

  Return JSON:
  {"changes_picture": bool, "change_type": "delta|contradiction|confirmation|none", "what": "description or null", "new_question": "question or null"}

question_priority: |
  Score and rank these open research questions by priority.

  Questions:
  {{questions}}

  Recent stream:
  {{recent_stream}}

  Current picture:
  {{current_picture}}

  Score each 0.0-1.0 by: centrality to conflict understanding, current-picture relevance, recency signal, age.

  Return JSON: {"ranked": [{"id": "str", "score": 0.0}]}
