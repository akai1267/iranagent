version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  orchestrator:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    volumes: ["./memory:/memory", "./config:/config"]
    restart: on-failure

  monitor:
    build:
      context: .
      dockerfile: agents/monitor/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    volumes: ["./memory:/memory", "./config:/config"]
    restart: on-failure

  researcher:
    build:
      context: .
      dockerfile: agents/researcher/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    depends_on: [redis]
    volumes: ["./memory:/memory", "./config:/config"]
    restart: on-failure

  source_monitor:
    build:
      context: .
      dockerfile: agents/source_monitor/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    volumes: ["./memory:/memory", "./config:/config"]
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    volumes: ["./memory:/memory"]
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  redis_data:
