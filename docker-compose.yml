version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on: [redis]
    volumes: ["./memory:/memory", "./config:/config"]
    restart: on-failure

volumes:
  redis_data:
