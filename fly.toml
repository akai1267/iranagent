app = "iran-intel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "memory_vol"
  destination = "/memory"
